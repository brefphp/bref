name: Website preview

# Deploys a preview of the website for pull requests that change it.
# Vercel deletes old previews automatically (deployment retention policy).
on:
    pull_request:
        paths:
            - 'docs/**'
            - 'website/**'
            - '.github/workflows/website-preview.yml'

env:
    VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:

    deploy:
        # Pull requests from forks and from Dependabot don't have access to the secrets
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        runs-on: ubuntu-latest
        concurrency:
            group: website-preview-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        permissions:
            contents: read
            deployments: write
        defaults:
            run:
                working-directory: ./website
        environment:
            name: preview
            url: ${{ steps.deploy.outputs.url }}
        steps:
            -   uses: actions/checkout@v6
                with:
                    fetch-depth: 0 # fetch all history for "latest modified time"
            -   run: npm install --global vercel@latest
            -   run: make content/docs
            -   name: Pull Vercel Environment Information
                run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
            -   name: Build
                run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
                env:
                    # See website.yml
                    GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN_READ }}
            -   name: Deploy
                id: deploy
                run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

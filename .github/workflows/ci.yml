name: CI

on:
    push:
        branches: ['master', '2.x', '4.x']
        paths-ignore: &docs-only
            - 'docs/**'
            - 'website/**'
            - '**.md'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/workflows/website*.yml'
    pull_request:
        branches: ['*']
        paths-ignore: *docs-only
    schedule:
        -   cron: '0 0 * * *'

# Cancel the previous run when new commits are pushed to a pull request
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

    php-tests:
        name: Tests - PHP ${{ matrix.php }} ${{ matrix.dependency-version }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        strategy:
            matrix:
                php: [ '8.5', '8.4', '8.3', '8.2' ]
                dependency-version: [ '' ]
                platform-reqs: [ '' ]
                include:
                    -   php: '8.2'
                        dependency-version: '--prefer-lowest'
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            # Node is required by some tests
            -   uses: actions/setup-node@v6
                with:
                    node-version: 22
            # serverless is required by some tests
            -   name: Install serverless
                run: npm i -g osls
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    tools: composer:v2
                    coverage: none
                    ini-values: expose_php=1
            -   name: Install dependencies
                uses: ramsey/composer-install@v4
                with:
                    dependency-versions: ${{ matrix.dependency-version == '--prefer-lowest' && 'lowest' || 'highest' }}
                    composer-options: ${{ matrix.platform-reqs }}
            -   name: Execute Unit Tests
                run: 'vendor/bin/phpunit --testsuite small'

    phpstan:
        runs-on: ubuntu-24.04
        name: PHPStan
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    tools: composer:v2, cs2pr
                    coverage: none
            -   name: Install dependencies
                uses: ramsey/composer-install@v4
            -   name: PHPStan
                run: vendor/bin/phpstan analyse --error-format=checkstyle | cs2pr

    phpcs:
        runs-on: ubuntu-24.04
        name: PHP CodeSniffer
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    tools: composer:v2, cs2pr
                    coverage: none
            -   name: Install dependencies
                uses: ramsey/composer-install@v4
            -   name: PHP CS
                run: vendor/bin/phpcs -q --no-colors --report=checkstyle | cs2pr

    js-lint:
        runs-on: ubuntu-24.04
        name: JS type validation and linting
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
            - uses: actions/cache@v5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
            - run: npm i
            - run: npm run lint

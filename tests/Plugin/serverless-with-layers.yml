service: bref
provider:
    name: aws
    layers:
        - arn:aws:lambda:us-east-1:1234567890:layer:foo:1

plugins:
    - ./bref.js

functions:

    function:
        handler: function.php
        runtime: php-83

    function-with-layers:
        handler: function.php
        runtime: php-83
        layers:
            - arn:aws:lambda:us-east-1:1234567890:layer:bar:1

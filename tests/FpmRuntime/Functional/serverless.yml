service: bref-tests

provider:
    name: aws
    region: eu-west-1
    profile: bref-tests
    apiGateway:
        binaryMediaTypes:
            - '*/*'

plugins:
    - ./index.js

package:
    patterns:
        - '!**'
        - 'src/**'
        - 'tests/**'
        - 'vendor/**'

functions:

    fpm:
        handler: fpm/index.php
        description: 'Bref FPM test'
        timeout: 5 # in seconds (API Gateway has a timeout of 29 seconds)
        reservedConcurrency: 5
        runtime: php-85-fpm
        events:
            -   http: 'ANY /'
        environment:
            FOO: bar

    httpApi:
        handler: http-api/index.php
        description: 'Bref HTTP API test'
        timeout: 5 # in seconds (API Gateway has a timeout of 29 seconds)
        reservedConcurrency: 5
        runtime: php-85
        events:
            -   httpApi: 'GET /'
